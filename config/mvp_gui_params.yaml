flask_node:
  ros__parameters:
    # The path to the directory containing offline map tile sets.
    # This path is relative to the package's share directory.
    # Example structure: <install_space>/share/mvp_gui_2/mvp_gui_offline_map/
    tiles_dir: "mvp_gui_offline_map/"
    db_filename: "mvp_gui.db" # Database will be stored in the package share dir
    kml_upload_folder: "kml_uploads" # Also in package share dir

    # Thresholds for color-coding vehicle status values
    status_thresholds:
      roll:
        yellow: 20.0 # abs degrees
        red: 40.0   # abs degrees
      pitch:
        yellow: 20.0 # abs degrees
        red: 40.0   # abs degrees
      altimeter:
        yellow: 4.0
        red: 2.0
      voltage:
        yellow: 18.0 # volts, lower is worse
        red: 16.0    # volts, lower is worse
      current:
        yellow: 10.0 # amps, higher is worse
        red: 15.0    # amps, higher is worse
      cpu_temp:
        yellow: 55.0 # Celsius, higher is worse
        red: 65.0    # Celsius, higher is worse
      cpu_usage:
        yellow: 75.0 # percent, higher is worse
        red: 90.0    # percent, higher is worse
      mem_usage:
        yellow: 75.0 # percent, higher is worse
        red: 90.0    # percent, higher is worse
      time_since_update:
        yellow: 60.0 # seconds
        red: 180.0   # seconds

ros_interface_node:
  ros__parameters:
    #----------------------------
    # Namespaces
    #----------------------------
    topic_ns: "/mvp2_test_robot/remote/id_2/"
    service_ns: "/mvp2_test_robot/remote/id_2/"

    #----------------------------
    # Explicit Sources (Complex Logic)
    #----------------------------
    # These require specific synchronization logic, so they remain explicit
    poses_source: "odometry"
    geo_pose_source: "geopose"
    
    #----------------------------
    # Dynamic Topic Schema
    #----------------------------
    # Maps a topic suffix (key) to an internal Event ID (value)
    # The code will scan for topic_ns + suffix.
    topic_schema:
      "altimeter": "altimeter_update"
      "survey/geopath": "published_path_update"
      "helm/state": "helm_state_update"
      "controller_state": "controller_state_update"
      "gpio_power_state": "power_update"
      "roslaunch_state": "launch_status_update"
      "computer_info": "computer_info_update"
      "power_info": "power_info_update"

    #----------------------------
    # Dynamic Service Schema
    #----------------------------
    # Maps a service suffix (key) to a Service Type string (value)
    service_schema:
      "mvp_helm/change_state": "mvp_msgs/srv/SetString"
      "controller/set": "std_srvs/srv/SetBool"
      "mvp_helm/set_waypoints": "mvp_msgs/srv/SendWaypoints"
      # Note: power and launch services are handled by the C2 discovery mechanism,
      # but could be moved here if they were static names.

    # Name of the node to fetch dynamic launch/power configurations from
    c2_commander_node: "/mvp2_test_robot/mvp_c2_commander"