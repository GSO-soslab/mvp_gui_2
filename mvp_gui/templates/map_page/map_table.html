<div style="position: relative;">
    <div id="map" class="map"></div>

    <!-- LEGEND -->
    <div id="map-legend" class="map-legend">
        <h4>Legend</h4>
        <ul id="legend-items">
            <!-- Dynamically populated -->
        </ul>
    </div>

    <!-- MEASUREMENT TOOL BUTTON -->
    <button id="measure-button" class="btn btn-sm btn-secondary">Measure</button>
</div>

<style>
    .map {
        height: 92vh;
        /* Set map to be 65% of the viewport height to prevent scrolling */
    }

    /* --- Styles for Published Waypoints (Yellow Triangles) --- */
    .published-wpt-marker {
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 0;
    }

    .published-wpt-id {
        font-size: 14px;
        color: #fffca0;
        background: transparent;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    /* --- Styles for Editable Waypoints (Red Diamonds) --- */
    .editable-wpt-marker {
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
        cursor: grab;
        /* Change cursor to indicate draggability */
    }

    .editable-wpt-marker:active {
        cursor: grabbing;
    }

    .editable-wpt-diamond {
        width: 23px;
        height: 23px;
        background-color: #ff190a;
        /* Red */
        transform: rotate(45deg);
        transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out;
    }

    .editable-wpt-id {
        font-size: 15px;
        color: #fba5b0;
        background: transparent;
        transform: rotate(-45deg);
        position: absolute;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    /* --- Style for when a waypoint is being dragged --- */
    .editable-wpt-marker.marker-dragging {
        z-index: 20;
    }

    .editable-wpt-marker.marker-dragging .editable-wpt-diamond {
        transform: rotate(45deg);
        box-shadow: 0 0 10px 3px rgba(255, 25, 10, 0.7);
    }

    /* --- Styles for User-Defined Markers (Pentagons) --- */
    .user-marker-container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .user-marker-shape {
        width: 22px;
        height: 22px;
        /* background-color is now set dynamically via JavaScript */
        clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
        /* Pentagon */
        opacity: 0.7;
        /* border: 1px solid white; */
        z-index: 5;
        /* Lower than editable waypoints */
        cursor: pointer;
    }

    .user-marker-label {
        font-size: 12px;
        /* color is now set dynamically via JavaScript */
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        transform: translateY(2px);
        /* Position label slightly below marker shape */
        white-space: nowrap;
        /* Prevent name from wrapping */
    }


    /* --- Style for Segment Labels on Lines --- */
    .altitude-label-marker {
        font-size: 12px;
        font-weight: bold;
        text-align: center;
        background: transparent;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        z-index: 5;
        line-height: 1.1;
        /* Adjust for multiple lines of text */
    }

    .altitude-label-marker.published {
        color: #fffca0;
        /* Yellow for published path */
    }

    .altitude-label-marker.editable {
        color: #fba5b0;
        /* Red for editable path */
    }


    /* --- Common & Vehicle Marker Styles --- */
    .marker-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    .arrow-marker {
        width: 40px;
        height: 40px;
        background: url('{{ url_for('static', filename='icons/white_arrow.png') }}') no-repeat center center;
        background-size: contain;
        transform-origin: center;
    }

    .groundstation-marker,
    .secondary-marker {
        background-size: contain;
        transform-origin: center;
    }

    .groundstation-marker {
        width: 45px;
        height: 45px;
        background-image: url('{{ url_for('static', filename='icons/ground_station_icon.png') }}');
    }

    .secondary-marker {
        width: 20px;
        height: 20px;
        background-color: blue;
        border-radius: 50%;
    }

    /* --- Legend Styles --- */
    .map-legend {
        position: absolute;
        top: 10px;
        right: 10px;
        /* Changed from left */
        background: rgba(40, 40, 40, 0.9);
        color: #fff;
        padding: 8px 12px;
        /* Made smaller */
        border-radius: 5px;
        z-index: 1000;
        font-family: Arial, sans-serif;
        max-width: 220px;
        /* Made smaller */
        border: 1px solid #555;
    }

    .map-legend h4 {
        margin-top: 0;
        margin-bottom: 8px;
        /* Made smaller */
        font-size: 14px;
        /* Made smaller */
        border-bottom: 1px solid #666;
        padding-bottom: 4px;
    }

    .map-legend ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .map-legend li {
        margin-bottom: 4px;
        /* Made smaller */
        display: flex;
        align-items: center;
        font-size: 12px;
    }

    .legend-color-box {
        width: 18px;
        /* Made smaller */
        height: 10px;
        margin-right: 8px;
        /* Made smaller */
        border: 1px solid #ccc;
    }

    /* --- Style for Map Scale Control --- */
    .maplibregl-ctrl-scale {
        /* Reset the previous box style */
        background-color: transparent;
        border-radius: 0;
        padding: 2px 5px 0 5px; /* Horizontal padding, small top padding for text spacing */
        box-shadow: none; /* In case any default shadow is applied */

        /* Create the scale bar line and ticks using borders */
        border-style: solid;
        border-color: #ffffff; /* White lines for the scale */
        border-width: 0 2px 2px 2px; /* 0 top, 2px right, 2px bottom, 2px left */
        margin-bottom: 10px; /* Consistent spacing from the bottom edge */

        /* Style the text for maximum clarity and visibility */
        color: #ffffff; /* White text */
        font-weight: bold;
        font-size: 12px; /* Make text slightly more compact */
        line-height: 1; /* Use a standard line-height for predictability */
        text-align: center;
    }

    /* --- Styles for Measurement Tool --- */
    #measure-button {
        position: absolute;
        bottom: 36px; /* Positioned to leave a clean gap above the scale control */
        left: 10px;
        z-index: 1000;
        opacity: 0.75;
    }

    .measurement-label {
        background-color: rgba(0, 0, 0, 0.7);
        color: #00ffff; /* Cyan to match the line */
        padding: 3px 7px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: bold;
        border: 1px solid #00ffff;
        white-space: nowrap; /* Prevent wrapping */
    }
</style>

<!-- Load the helper functions first -->
<script src="{{ url_for('static', filename='js/map_helpers.js') }}"></script>

<script>
    // --- Global State & Configuration ---
    let map; // The map object
    let isMapInitialized = false; // Becomes true ONLY when the map 'load' event has fired
    let currentMapType = 'offline'; // Can be 'offline', 'online', or 'noaa'
    const MAX_HISTORY_POINTS = 150;
    const MAX_HISTORY_POINTS_GPS = 30;
    const MAP_STATE_KEY = 'mvpMapState';

    const EDITABLE_PATH_STYLE_DEFAULT = {
        'line-color': '#ff190a',
        'line-width': 3,
        'line-dasharray': [2, 4],
        'line-opacity': 0.5
    };
    const EDITABLE_PATH_STYLE_DRAGGING = {
        'line-color': '#ff190a',
        'line-width': 3,
        'line-dasharray': [2, 4],
        'line-opacity': 1 // Original style but fully opaque
    };

    // --- Client-Side Data Stores ---
    let vehicleHistory = [];
    let currentVehiclePose = null; // Holds the most recent pose data for runtime use
    let lastPublishedPath = []; // Holds the most recent path data for runtime use
    let editableWaypointsData = {{ items_jsn | safe }}; // Use 'let' to allow modification
    const serverUrlRoot = "{{ request.url_root }}"; // Gets the app's root URL, e.g., "http://127.0.0.1:5001/"
    let editablePathTotalDistance = 0;
    let publishedPathTotalDistance = 0;

    // --- Marker Storage ---
    let vehicleMarker, topsideMarker, secondaryMarker;
    let editableWaypointMarkers = [];
    let publishedWaypointMarkers = [];
    let editableAltitudeMarkers = [];
    let publishedAltitudeMarkers = [];

    // --- Dynamic GPS ---
    let dynamicGPSMarkers = {}; // Store markers for each GPS topic
    let dynamicGPSHistories = {}; // Store histories for each GPS topic
    let dynamicGPSColors = {}; // Store colors for each GPS topic

    // --- User-Defined Markers & Waypoint Adding---
    let isAddingUserMarker = false;
    let isAddingWaypoint = false;
    let userMarkersData = []; // Array of {id, lat, lon, name, color}
    let userMarkerObjects = {}; // Map of id -> maplibre marker object

    // --- Measurement Tool ---
    let isMeasuring = false;
    let measurementPoints = [];
    let measurementMarkers = [];
    let measurementLabel = null;

    // --- WebSocket Event Handlers ---
    socket.on('vehicle_pose_update', (data) => {
        if (!data || data.lon === undefined || data.lat === undefined) return;
        currentVehiclePose = { ...data };
        updateHistory(vehicleHistory, data);
        if (!map) {
            initializeMap([data.lon, data.lat]);
            addScaleToMap(); // Add scale control to the newly created map instance
        }
        if (isMapInitialized) {
            updateVehicle(data);
            redrawAllTrails();
            updateEditablePathLine();
        }
    });

    socket.on('dynamic_gps_update', (data) => {
        if (!data || !data.topic || !data.data) {
            console.error("Received incomplete dynamic_gps_update:", data);
            return;
        }
        // Initialize map if it hasn't been, using the first valid coordinates we receive.
        // This ensures the `map` object exists before `updateDynamicGPS` is called.
        if (!map && data.data.lon != null && data.data.lat != null) {
            initializeMap([data.data.lon, data.data.lat]);
        }
        // updateDynamicGPS has its own internal checks for map state and data validity.
        updateDynamicGPS(data.topic, data.data);
    });

    socket.on('published_path_update', (data) => {
        lastPublishedPath = data || [];
        if (isMapInitialized) {
            drawPublishedPath();
        }
    });

    socket.on('waypoints_updated', (data) => {
        console.log("Waypoints updated from server:", data.waypoints);
        // Replace the local data cache with the fresh data from the server
        editableWaypointsData.length = 0; // Clear the array in-place
        // Use push.apply to add all elements from the new array
        Array.prototype.push.apply(editableWaypointsData, data.waypoints);

        // Redraw the map elements that depend on this data
        if (isMapInitialized) {
            createEditableWaypointMarkers(); // This will remove old markers and create new ones
            updateEditablePathLine();
        }
    });

    socket.on('gps_topic_unsubscribed', (data) => {
        const topicName = data.topic;
        console.log(`Received unsubscription confirmation for ${topicName}. Removing from map.`);
        if (!topicName || !map || !isMapInitialized) return;

        // Remove head marker
        if (dynamicGPSMarkers[topicName]) {
            dynamicGPSMarkers[topicName].remove();
            delete dynamicGPSMarkers[topicName];
        }

        const sanitizedTopicName = topicName.replace(/[^\w-]/g, '_');

        // Remove point trail layer and source
        const sourceId = `gps-trail-points-${sanitizedTopicName}`;
        const layerId = `gps-trail-points-layer-${sanitizedTopicName}`;
        if (map.getLayer(layerId)) {
            map.removeLayer(layerId);
        }
        if (map.getSource(sourceId)) {
            map.removeSource(sourceId);
        }

        // Clean up any old line trail layer and source
        const oldSourceId = `gps-trail-${sanitizedTopicName}`;
        const oldLayerId = `gps-trail-layer-${sanitizedTopicName}`;
        if (map.getLayer(oldLayerId)) {
            map.removeLayer(oldLayerId);
        }
        if (map.getSource(oldSourceId)) {
            map.removeSource(oldSourceId);
        }

        // Clean up client-side data stores
        delete dynamicGPSHistories[topicName];
        delete dynamicGPSColors[topicName];

        // Update the legend
        updateLegend();

        // Persist the state change to session storage so the trail doesn't reappear on reload.
        saveMapState();
    });

    // --- Page Load & Interaction Execution ---
    document.addEventListener('DOMContentLoaded', () => {
        // Load history and view settings, but wait for live data to init map
        const loadedState = loadMapState();
        updateMapStatusText(); // Set the initial status text

        if (loadedState) {
            const [center, zoom] = loadedState;
            // We have a center/zoom, but we still wait for the first pose to init
            // to ensure the vehicle is visible. The init function will use the
            // loaded center/zoom if the pose isn't available yet.
            // This case is handled inside initializeMap, but in practice the pose
            // arrives almost instantly from the server cache.
        }
        document.getElementById('map-switch-button').addEventListener('click', () => {
            if (!map) return;
            // Cycle through the map types: offline -> online -> noaa -> offline
            if (currentMapType === 'offline') {
                currentMapType = 'online';
            } else if (currentMapType === 'online') {
                currentMapType = 'noaa';
            } else { // it must be 'noaa'
                currentMapType = 'offline';
            }
            updateMapStatusText();
            saveMapState();
            const center = map.getCenter();
            const zoom = map.getZoom();
            map.remove();
            map = null;
            vehicleMarker = topsideMarker = secondaryMarker = null;
            editableWaypointMarkers = [];
            editableAltitudeMarkers = [];
            publishedAltitudeMarkers = [];
            dynamicGPSMarkers = {};
            isMapInitialized = false;
            // Re-initialize using the last known vehicle pose if available, otherwise the old center.
            const initCoords = currentVehiclePose ? [currentVehiclePose.lon, currentVehiclePose.lat] : [center.lng, center.lat];
            initializeMap(initCoords, zoom);
            addScaleToMap(); // Add scale control to the newly created map instance
        });

        document.getElementById('publish-waypoints-button').addEventListener('click', () => {
            socket.emit('publish_waypoints_request');
        });

        const addWaypointBtn = document.getElementById('add-waypoint-button');
        const addUserMarkerBtn = document.getElementById('add-user-marker-button');
        const measureBtn = document.getElementById('measure-button');

        // --- Add Waypoint Button Logic ---
        addWaypointBtn.addEventListener('click', () => {
            if (!isMapInitialized) return;
            if (isAddingUserMarker) addUserMarkerBtn.click(); // Deactivate other mode
            if (isMeasuring) measureBtn.click(); // Deactivate measurement mode

            isAddingWaypoint = !isAddingWaypoint;
            if (isAddingWaypoint) {
                addWaypointBtn.classList.add('btn-success');
                addWaypointBtn.classList.remove('btn-primary');
                addWaypointBtn.textContent = 'Click on map to place waypoint...';
                map.getCanvas().style.cursor = 'crosshair';
            } else {
                addWaypointBtn.classList.remove('btn-success');
                addWaypointBtn.classList.add('btn-primary');
                addWaypointBtn.textContent = 'Add Waypoint';
                map.getCanvas().style.cursor = '';
            }
        });

        // --- Add User Marker Button Logic ---
        addUserMarkerBtn.addEventListener('click', () => {
            if (!isMapInitialized) return;
            if (isAddingWaypoint) addWaypointBtn.click(); // Deactivate other mode
            if (isMeasuring) measureBtn.click(); // Deactivate measurement mode

            isAddingUserMarker = !isAddingUserMarker;
            if (isAddingUserMarker) {
                addUserMarkerBtn.classList.add('btn-success');
                addUserMarkerBtn.classList.remove('btn-info');
                addUserMarkerBtn.textContent = 'Click on map to place marker...';
                map.getCanvas().style.cursor = 'crosshair';
            } else {
                addUserMarkerBtn.classList.remove('btn-success');
                addUserMarkerBtn.classList.add('btn-info');
                addUserMarkerBtn.textContent = 'Add User Marker';
                map.getCanvas().style.cursor = '';
            }
        });

        // --- Measurement Button Logic ---
        measureBtn.addEventListener('click', () => {
            if (!isMapInitialized) return;

            // If we are currently in "Clear Measurement" mode, just clear and exit.
            if (measurementPoints.length === 2) {
                clearMeasurement();
                isMeasuring = false; // Explicitly exit measurement mode.
                return;
            }

            // Deactivate other modes BEFORE toggling our own state to prevent recursion.
            // When the other handlers are called, 'isMeasuring' is still false.
            if (isAddingUserMarker) addUserMarkerBtn.click();
            if (isAddingWaypoint) addWaypointBtn.click();

            // Toggle measurement mode
            isMeasuring = !isMeasuring;

            if (isMeasuring) {
                measureBtn.textContent = 'Click to place 1st point...';
                measureBtn.classList.add('btn-warning');
                measureBtn.classList.remove('btn-secondary');
                map.getCanvas().style.cursor = 'crosshair';
            } else {
                // Cancel measurement if it was started but not finished
                clearMeasurement(); // This also resets the button text and style
                map.getCanvas().style.cursor = '';
            }
        });


        document.addEventListener('clear-history-trails', () => {
            console.log("Clear history trails event received.");
            vehicleHistory = [];
            // Also clear all dynamic GPS history trails
            Object.keys(dynamicGPSHistories).forEach(topic => {
                dynamicGPSHistories[topic] = [];
            });

            if (isMapInitialized) {
                redrawAllTrails();
                redrawDynamicGpsTrails();
            }
            saveMapState();
        });

        // Event listener for waypoint modal's SAVE button
        document.getElementById('saveWaypointChanges').addEventListener('click', () => {
            const waypointData = {
                id: document.getElementById('editWaypointId').value,
                lat: parseFloat(document.getElementById('editWaypointLat').value),
                lon: parseFloat(document.getElementById('editWaypointLon').value),
                alt: parseFloat(document.getElementById('editWaypointAlt').value),
                surge: parseFloat(document.getElementById('editWaypointSurge').value),
            };
            if (isNaN(waypointData.lat) || isNaN(waypointData.lon) || isNaN(waypointData.alt) || isNaN(waypointData.surge)) {
                alert("Please enter valid numbers for all waypoint fields.");
                return;
            }
            socket.emit('update_waypoint', waypointData);
            $('#waypointEditModal').modal('hide');
        });

        // Event listener for waypoint modal's DELETE button
        document.getElementById('deleteWaypoint').addEventListener('click', () => {
            const waypointId = document.getElementById('editWaypointId').value;
            if (confirm(`Are you sure you want to delete waypoint ${waypointId}?`)) {
                socket.emit('delete_waypoint', { id: waypointId });
                $('#waypointEditModal').modal('hide');
            }
        });

        // Event listener for user marker modal's SAVE button
        document.getElementById('saveUserMarkerChanges').addEventListener('click', () => {
            const markerId = document.getElementById('userMarkerId').value;
            const updatedMarkerData = {
                name: document.getElementById('userMarkerName').value,
                lat: parseFloat(document.getElementById('userMarkerLat').value),
                lon: parseFloat(document.getElementById('userMarkerLon').value),
            };

            const markerIndex = userMarkersData.findIndex(m => m.id == markerId);
            if (markerIndex > -1) {
                userMarkersData[markerIndex].name = updatedMarkerData.name;
                userMarkersData[markerIndex].lat = updatedMarkerData.lat;
                userMarkersData[markerIndex].lon = updatedMarkerData.lon;

                const markerObject = userMarkerObjects[markerId];
                if (markerObject) {
                    markerObject.setLngLat([updatedMarkerData.lon, updatedMarkerData.lat]);
                    const labelEl = markerObject.getElement().querySelector('.user-marker-label');
                    if (labelEl) labelEl.innerText = updatedMarkerData.name;
                }
                updateLegend();
                saveMapState();
            }
            $('#userMarkerEditModal').modal('hide');
        });

        // Event listener for user marker modal's DELETE button
        document.getElementById('deleteUserMarker').addEventListener('click', () => {
            const markerId = document.getElementById('userMarkerId').value;
            if (confirm(`Are you sure you want to delete this user marker?`)) {
                const markerIndex = userMarkersData.findIndex(m => m.id == markerId);
                if (markerIndex > -1) {
                    userMarkersData.splice(markerIndex, 1); // Remove from data array
                    const markerObject = userMarkerObjects[markerId];
                    if (markerObject) {
                        markerObject.remove(); // Remove from map
                        delete userMarkerObjects[markerId]; // Remove from tracking object
                    }
                    updateLegend();
                    saveMapState();
                }
                $('#userMarkerEditModal').modal('hide');
            }
        });
    });

    window.addEventListener('beforeunload', saveMapState);
</script>
