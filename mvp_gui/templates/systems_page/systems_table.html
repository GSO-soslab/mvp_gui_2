<h4>ROS Launch Control</h4>
<p style="color: lightskyblue;">Use these buttons to launch or terminate external ROS launch files managed by the C2
    Commander.</p>
<table class="table table-hover table-dark">
    <thead>
        <tr>
            <th scope="col">Launch File</th>
            <th scope="col">Action</th>
        </tr>
    </thead>
    <tbody id="launch-control-table-body">
        <tr>
            <td colspan="2" class="text-center font-italic text-muted py-3">Waiting for launch files from ROS node...
            </td>
        </tr>
    </tbody>
</table>
<br>

<h4>ROS Launch Status</h4>
<table class="table table-hover table-dark">
    <thead>
        <tr>
            <th scope="col">Launch File</th>
            <th scope="col">Status</th>
        </tr>
    </thead>
    <tbody id="launch-status-table-body">
        <tr>
            <td colspan="2" class="text-center font-italic text-muted py-3">Waiting for launch status from ROS node...
            </td>
        </tr>
    </tbody>
</table>


<script>
    document.addEventListener('DOMContentLoaded', function () {
        // --- Launch Control ---
        window.launchFile = function (launchKey, status) {
            console.log(`Requesting to ${status ? 'launch' : 'terminate'}: ${launchKey}`);
            socket.emit('ros_action', {
                action: 'launch_file',
                key: launchKey,
                status: status
            });
        };

        // --- Handler to build/update the tables with launch keys ---
        socket.on('update_launch_keys', function (data) {
            console.log('Received launch keys update:', data);
            const keys = data.keys || [];
            const controlTableBody = document.getElementById('launch-control-table-body');
            const statusTableBody = document.getElementById('launch-status-table-body');

            if (!controlTableBody || !statusTableBody) {
                console.error('Table body elements not found!');
                return;
            }

            // Clear existing rows
            controlTableBody.innerHTML = '';
            statusTableBody.innerHTML = '';

            if (keys.length === 0) {
                const controlPlaceholder = `
                    <tr>
                        <td colspan="2" class="text-center font-italic text-muted py-3">Waiting for launch files from ROS node...</td>
                    </tr>`;
                const statusPlaceholder = `
                    <tr>
                        <td colspan="2" class="text-center font-italic text-muted py-3">Waiting for launch status from ROS node...</td>
                    </tr>`;
                controlTableBody.innerHTML = controlPlaceholder;
                statusTableBody.innerHTML = statusPlaceholder;
                return;
            }

            // Populate tables with new data
            keys.forEach(key => {
                // Populate control table
                const controlRow = document.createElement('tr');
                controlRow.innerHTML = `
                    <td>${key}</td>
                    <td>
                        <button class="btn btn-success btn mr-5" onclick="launchFile('${key}', true)">
                            Launch
                        </button>
                        <button class="btn btn-danger btn" onclick="launchFile('${key}', false)">
                            Terminate
                        </button>
                    </td>
                `;
                controlTableBody.appendChild(controlRow);

                // Populate status table
                const statusRow = document.createElement('tr');
                const statusCellId = 'status-' + key.replace(/\//g, '-');
                statusRow.innerHTML = `
                    <td>${key}</td>
                    <td id="${statusCellId}"><strong>Unknown</strong></td>
                `;
                statusTableBody.appendChild(statusRow);
            });
        });

        // --- Status Updates via WebSocket ---
        socket.on('launch_status_update', function (data) {
            console.log('Launch status update received:', data);
            const keys = data.keys || [];
            const statuses = data.statuses || [];

            keys.forEach((key, index) => {
                const elementId = 'status-' + key.replace(/\//g, '-');
                const statusCell = document.getElementById(elementId);

                if (statusCell) {
                    const status = statuses[index];
                    if (status === 1) {
                        statusCell.innerHTML = '<strong>Launched</strong>';
                        statusCell.style.color = 'lightgreen';
                    } else {
                        statusCell.innerHTML = '<strong>Not Launched</strong>';
                        statusCell.style.color = 'lightcoral';
                    }
                } else {
                    console.warn('Could not find status cell with ID:', elementId, '- Table might not be populated yet.');
                }
            });
        });
    });
</script>
