{# mvp_gui/templates/base.html #}
<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/maplibre-gl.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='js/maplibre-gl.js') }}"></script>
    <script src="{{ url_for('static', filename='js/plotly-latest.min.js') }}"></script>
    <!-- Add Socket.IO client library -->
    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>

    <script>
        // Establish a global Socket.IO connection
        const socket = io();
        socket.on('connect', () => {
            console.log('Connected to server via WebSocket.');
        });
        socket.on('disconnect', () => {
            console.log('Disconnected from server.');
        });

        // Global handler to update map session storage when a GPS topic is unsubscribed,
        // ensuring the state is correct even if the map page isn't open.
        socket.on('gps_topic_unsubscribed', (data) => {
            const topicName = data.topic;
            if (!topicName) return;

            console.log(`Global Unsubscribe Handler: Received event for ${topicName}. Updating session storage.`);

            const MAP_STATE_KEY = 'mvpMapState'; // Must match the key in map_table.html
            const savedStateJSON = sessionStorage.getItem(MAP_STATE_KEY);

            if (savedStateJSON) {
                try {
                    const savedState = JSON.parse(savedStateJSON);
                    let stateModified = false;

                    // Remove the topic's history trail from the stored state
                    if (savedState.dynamicGPSHistories && savedState.dynamicGPSHistories.hasOwnProperty(topicName)) {
                        delete savedState.dynamicGPSHistories[topicName];
                        stateModified = true;
                    }

                    // Remove the topic's color from the stored state
                    if (savedState.dynamicGPSColors && savedState.dynamicGPSColors.hasOwnProperty(topicName)) {
                        delete savedState.dynamicGPSColors[topicName];
                        stateModified = true;
                    }

                    // If we changed something, write it back to session storage
                    if (stateModified) {
                        sessionStorage.setItem(MAP_STATE_KEY, JSON.stringify(savedState));
                        console.log(`Global Unsubscribe Handler: Successfully updated session storage for ${topicName}.`);
                    }
                } catch (e) {
                    console.error("Global Unsubscribe Handler: Error updating map state from session storage:", e);
                }
            }
        });

        // --- GLOBAL TIME SINCE UPDATE ---
        const GLOBAL_THRESHOLDS = JSON.parse('{{ status_thresholds_json|safe }}');

        // This handler updates the timestamp of the last received vehicle pose message.
        // The timestamp is from the ROS message header, representing the data's actual age.
        socket.on('vehicle_pose_update', (data) => {
            if (data && data.header_timestamp) {
                // The timestamp from ROS is in seconds since epoch. Store it.
                sessionStorage.setItem('lastMessageRosTimestamp', data.header_timestamp);
            }
        });

        // Update display elements every second
        setInterval(function () {
            // Use the ROS timestamp stored in session storage
            const lastRosTimestamp = sessionStorage.getItem('lastMessageRosTimestamp');
            const timeSinceUpdateElements = document.querySelectorAll('.time-since-update-display');

            if (!lastRosTimestamp || timeSinceUpdateElements.length === 0) {
                // If there's no stored time or no elements to update, do nothing.
                return;
            }

            // lastRosTimestamp is in seconds since epoch. Date.now() is in milliseconds.
            const timeSinceUpdate = (Date.now() / 1000) - parseFloat(lastRosTimestamp);
            const timeThresholds = GLOBAL_THRESHOLDS.time_since_update;

            let displayText;
            if (timeSinceUpdate < 2) {
                displayText = '&lt; 2 s'; // Use HTML entity
            } else {
                displayText = timeSinceUpdate.toFixed(0);
            }

            let colorClass = 'color-normal';
            if (timeThresholds) {
                if (timeSinceUpdate >= timeThresholds.red) {
                    colorClass = 'color-red';
                } else if (timeSinceUpdate >= timeThresholds.yellow) {
                    colorClass = 'color-yellow';
                }
            }
            
            timeSinceUpdateElements.forEach(el => {
                el.innerHTML = displayText;
                // Carefully manage classes to avoid removing essential styling
                el.classList.remove('color-normal', 'color-yellow', 'color-red');
                el.classList.add(colorClass);
            });

        }, 1000); // Update once per second
    </script>

    <style>
        body {
            margin-left: 2%;
            margin-right: 5%;
            padding: 0;
        }

        .nav-item.active .nav-link {
            color: white !important;
        }
    </style>

    <title>
        {% block title%}{% endblock %}
    </title>
    {% block head%}{% endblock %}
</head>

<body>
    <!-- Navbar here -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <a class="navbar-brand" href="#">MVP GUI</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item {% if current_page == 'systems' %}active{% endif %}">
                    <a class="nav-link" href="{{ url_for('systems_bp.systems_page') }}">Systems & Tools</a>
                </li>
                </li>
                <li class="nav-item {% if current_page == 'vehicle_status' %}active{% endif %}">
                    <a class="nav-link" href="{{ url_for('base_bp.vehicle_status_page') }}">Vehicle Status</a>
                </li>
                <li class="nav-item {% if current_page == 'power_manager' %}active{% endif %}">
                    <a class="nav-link" href="{{ url_for('power_manager_bp.power_manager_page') }}">Power Manager</a>
                </li>
                <li class="nav-item {% if current_page == 'mission' %}active{% endif %}">
                    <a class="nav-link" href="{{ url_for('mission_bp.mission_page') }}">Mission</a>
                </li>
                <li class="nav-item {% if current_page == 'map' %}active{% endif %}">
                    <a class="nav-link" href="{{ url_for('map_bp.map_page') }}">Map</a>
                </li>
            </ul>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- Optional JavaScript -->
    <script src="{{ url_for('static', filename='js/fontawesome.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.slim.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/popper.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

    {% block script %}{% endblock %}

</body>
<style>
    body {
        background-color: #212121;
        color: white;
    }
</style>

</html>
